name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
    defaults:
      run:
        working-directory: Macro-Shocks-Portfolio-Risk-Engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Macro-Shocks-Portfolio-Risk-Engine/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      # Unit tests use synthetic data only: no FRED key or network access needed.
      # The integration suite is left out: test_hawkish_surprise_rate_shock_elevated
      # has failed since before this workflow existed (a model-calibration question).
      - name: Unit tests
        run: python -m pytest python/tests/unit -q
